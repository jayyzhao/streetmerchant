version: '3.0'
services:
  gluetun-sm:
    image: qmcgaw/gluetun
    container_name: gluetun-sm
    restart: always
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    env_file:
      - dotenv.gluetun
    ports:
      - 10300:10300
  stock-checker:
    build:
      context: .
      dockerfile: Dockerfile
    network_mode: "service:gluetun-sm"
    depends_on:
      gluetun-sm:
        condition: service_healthy
    container_name: stock-checker
    env_file:
      - dotenv
